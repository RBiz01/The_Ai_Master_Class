<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Decompose flow</title>
  <desc id="desc">Messy ask flows into plan, then sub-tasks, then clean FINAL deliverable with VERIFY.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#00e5c0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#00e5c0"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  <circle cx="90" cy="60" r="70" fill="#7c5cff" opacity="0.12"/>
  <circle cx="880" cy="470" r="90" fill="#00e5c0" opacity="0.10"/>

  <text x="48" y="48" font-family="DM Sans, system-ui, sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">Decompose flow</text>
  <text x="48" y="74" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#94a3b8">Messy ask → Plan → Sub-tasks → FINAL (+ VERIFY)</text>

  <!-- Messy ask -->
  <rect x="40" y="110" width="200" height="120" rx="16" fill="#121826" stroke="#f87171" stroke-width="2"/>
  <text x="140" y="145" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#f87171">MESSY ASK</text>
  <text x="140" y="175" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="13" fill="#e2e8f0">Readiness + owners</text>
  <text x="140" y="198" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="13" fill="#e2e8f0">+ Monday blurb</text>

  <line x1="240" y1="170" x2="290" y2="170" stroke="#00e5c0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Plan -->
  <rect x="300" y="110" width="200" height="120" rx="16" fill="#121826" stroke="#7c5cff" stroke-width="2"/>
  <text x="400" y="145" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#7c5cff">SCRATCHPAD / PLAN</text>
  <text x="400" y="175" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="13" fill="#e2e8f0">3–5 bullets</text>
  <text x="400" y="198" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="13" fill="#e2e8f0">Risks · gates · gaps</text>

  <line x1="500" y1="170" x2="550" y2="170" stroke="#00e5c0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Sub-tasks stack -->
  <rect x="560" y="100" width="360" height="140" rx="16" fill="#121826" stroke="#334155" stroke-width="2"/>
  <text x="580" y="128" font-family="DM Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#00e5c0">SUB-TASKS (pipeline)</text>
  <rect x="580" y="142" width="320" height="28" rx="8" fill="#0a0e16" stroke="#334155"/>
  <text x="592" y="161" font-family="DM Sans, system-ui, sans-serif" font-size="13" fill="#e2e8f0">1 · Extract blockers → table</text>
  <rect x="580" y="176" width="320" height="28" rx="8" fill="#0a0e16" stroke="#334155"/>
  <text x="592" y="195" font-family="DM Sans, system-ui, sans-serif" font-size="13" fill="#e2e8f0">2 · Owners → Owner | Action | Due</text>
  <rect x="580" y="210" width="320" height="28" rx="8" fill="#0a0e16" stroke="#334155"/>
  <text x="592" y="229" font-family="DM Sans, system-ui, sans-serif" font-size="13" fill="#e2e8f0">3 · Draft blurb from approved table</text>

  <!-- FINAL + VERIFY -->
  <rect x="120" y="300" width="340" height="130" rx="16" fill="#121826" stroke="#00e5c0" stroke-width="2"/>
  <text x="290" y="335" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#00e5c0">FINAL</text>
  <text x="290" y="365" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">Paste-ready deliverable only</text>
  <text x="290" y="390" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="13" fill="#94a3b8">No scratchpad · no diary</text>

  <rect x="500" y="300" width="340" height="130" rx="16" fill="#121826" stroke="#7c5cff" stroke-width="2"/>
  <text x="670" y="335" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#7c5cff">VERIFY</text>
  <text x="670" y="365" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="13" fill="#e2e8f0">No invented ETAs</text>
  <text x="670" y="388" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="13" fill="#e2e8f0">Format + policy yes/no</text>

  <line x1="740" y1="240" x2="290" y2="300" stroke="#7c5cff" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="740" y1="240" x2="670" y2="300" stroke="#00e5c0" stroke-width="1.5" stroke-dasharray="4 4"/>

  <rect x="200" y="455" width="560" height="50" rx="14" fill="#0a0e16" stroke="url(#accentGrad)" stroke-width="2" filter="url(#glow)"/>
  <text x="480" y="486" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">One goal · one format · one done-when per step</text>

  <text x="48" y="525" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="#64748b">The Ai Master Class · Prompt Engineering Mastery · Module 4</text>
</svg>
