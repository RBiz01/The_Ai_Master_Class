<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Exemplar anatomy</title>
  <desc id="desc">Labeled parts of a few-shot exemplar: Label, Input, Output, Why, plus optional Near-miss lane.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#00e5c0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#00e5c0"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  <circle cx="90" cy="60" r="70" fill="#7c5cff" opacity="0.12"/>
  <circle cx="880" cy="470" r="90" fill="#00e5c0" opacity="0.10"/>

  <text x="48" y="48" font-family="DM Sans, system-ui, sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">Exemplar anatomy</text>
  <text x="48" y="74" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#94a3b8">Label · Input · Output · Why — teach the pattern, not trivia</text>

  <!-- Gold stack -->
  <rect x="48" y="110" width="520" height="300" rx="18" fill="#121826" stroke="#7c5cff" stroke-width="2"/>
  <text x="72" y="142" font-family="DM Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#7c5cff">GOLD EXEMPLAR</text>

  <rect x="72" y="160" width="470" height="48" rx="10" fill="#0a0e16" stroke="#334155"/>
  <text x="88" y="190" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">1 · LABEL — EXAMPLE 1 (good) · credit path</text>

  <rect x="72" y="220" width="470" height="48" rx="10" fill="#0a0e16" stroke="#334155"/>
  <text x="88" y="250" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">2 · INPUT — short realistic facts (same distribution)</text>

  <rect x="72" y="280" width="470" height="48" rx="10" fill="#0a0e16" stroke="#00e5c0" stroke-width="1.5"/>
  <text x="88" y="310" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">3 · OUTPUT — exact production FORMAT (JSON / table)</text>

  <rect x="72" y="340" width="470" height="48" rx="10" fill="#0a0e16" stroke="#334155"/>
  <text x="88" y="370" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">4 · WHY — one line naming the decision taught</text>

  <!-- Near-miss panel -->
  <rect x="600" y="110" width="312" height="300" rx="18" fill="#121826" stroke="#f87171" stroke-width="2"/>
  <text x="624" y="142" font-family="DM Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#f87171">NEAR-MISS LANE</text>
  <text x="624" y="178" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">Label: do not imitate</text>
  <text x="624" y="208" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">Same-shaped INPUT</text>
  <text x="624" y="238" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">Failed OUTPUT</text>
  <text x="624" y="268" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">WRONG BECAUSE: …</text>
  <text x="624" y="310" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="#94a3b8">Teaches the fence:</text>
  <text x="624" y="332" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="#94a3b8">invented ETA · format drift</text>
  <text x="624" y="354" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="#94a3b8">wrong offer · tone break</text>

  <!-- Flow to pack -->
  <rect x="200" y="440" width="560" height="56" rx="14" fill="#0a0e16" stroke="url(#accentGrad)" stroke-width="2" filter="url(#glow)"/>
  <text x="480" y="474" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">Lean pack: 2 golds + 1 near-miss → ships Monday</text>

  <line x1="308" y1="410" x2="400" y2="440" stroke="#7c5cff" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="756" y1="410" x2="560" y2="440" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="48" y="520" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="#64748b">The Ai Master Class · Prompt Engineering Mastery · Module 3</text>
</svg>
