<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Library taxonomy</title>
  <desc id="desc">Folders for email, notes, status, research, and governance beside a filled library card.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#00e5c0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  <circle cx="90" cy="60" r="70" fill="#7c5cff" opacity="0.12"/>
  <circle cx="880" cy="470" r="90" fill="#00e5c0" opacity="0.10"/>

  <text x="48" y="48" font-family="DM Sans, system-ui, sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">Library taxonomy</text>
  <text x="48" y="74" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#94a3b8">Folders + card fields — findable Monday, owned always</text>

  <!-- Folders -->
  <rect x="48" y="110" width="280" height="320" rx="18" fill="#121826" stroke="#334155" stroke-width="2"/>
  <text x="72" y="142" font-family="DM Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#7c5cff">FOLDERS</text>
  <rect x="72" y="160" width="232" height="36" rx="8" fill="#0a0e16" stroke="#00e5c0"/>
  <text x="88" y="183" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">email/</text>
  <rect x="72" y="208" width="232" height="36" rx="8" fill="#0a0e16" stroke="#334155"/>
  <text x="88" y="231" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">notes/</text>
  <rect x="72" y="256" width="232" height="36" rx="8" fill="#0a0e16" stroke="#334155"/>
  <text x="88" y="279" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">status/</text>
  <rect x="72" y="304" width="232" height="36" rx="8" fill="#0a0e16" stroke="#334155"/>
  <text x="88" y="327" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">research/</text>
  <rect x="72" y="352" width="232" height="36" rx="8" fill="#0a0e16" stroke="#f87171"/>
  <text x="88" y="375" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">_governance/</text>

  <!-- Card -->
  <rect x="360" y="110" width="552" height="320" rx="18" fill="#121826" stroke="#7c5cff" stroke-width="2"/>
  <text x="384" y="142" font-family="DM Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#7c5cff">LIBRARY CARD</text>
  <text x="384" y="178" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">Name: ops.customer-delay-json</text>
  <text x="384" y="208" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">Version: v1.2 · Changelog: blocked invented ETAs</text>
  <text x="384" y="238" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">Owner: learner@example.com</text>
  <text x="384" y="268" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">When: confirmed shipping slip</text>
  <text x="384" y="298" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">When NOT: legal / over-policy → human</text>
  <text x="384" y="328" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">Body: GCCF + constraints + FORMAT</text>
  <text x="384" y="358" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#00e5c0">Eval hooks: rubric + golden-delay-v1</text>
  <text x="384" y="396" font-family="DM Sans, system-ui, sans-serif" font-size="13" fill="#94a3b8">Never paste: secrets · real PII · live tokens</text>

  <rect x="200" y="455" width="560" height="50" rx="14" fill="#0a0e16" stroke="url(#accentGrad)" stroke-width="2" filter="url(#glow)"/>
  <text x="480" y="486" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">Monday kit ≥ 3 cards · owned · versioned · scored</text>

  <text x="48" y="525" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="#64748b">The Ai Master Class · Prompt Engineering Mastery · Module 6</text>
</svg>
