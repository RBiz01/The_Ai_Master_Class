<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Eval loop</title>
  <desc id="desc">Score with rubric, patch one lever, re-run golden set, then ship or loop again.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#00e5c0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#00e5c0"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  <circle cx="90" cy="60" r="70" fill="#7c5cff" opacity="0.12"/>
  <circle cx="880" cy="470" r="90" fill="#00e5c0" opacity="0.10"/>

  <text x="48" y="48" font-family="DM Sans, system-ui, sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">Eval loop</text>
  <text x="48" y="74" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#94a3b8">Score → Patch one lever → Re-run golden set → Decide</text>

  <!-- Four boxes in a cycle -->
  <rect x="80" y="130" width="200" height="110" rx="16" fill="#121826" stroke="#7c5cff" stroke-width="2"/>
  <text x="180" y="175" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c5cff">1 · SCORE</text>
  <text x="180" y="205" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="13" fill="#e2e8f0">Rubric pass/fail</text>

  <rect x="380" y="130" width="200" height="110" rx="16" fill="#121826" stroke="#00e5c0" stroke-width="2"/>
  <text x="480" y="175" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#00e5c0">2 · PATCH</text>
  <text x="480" y="205" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="13" fill="#e2e8f0">One lever only</text>

  <rect x="680" y="130" width="200" height="110" rx="16" fill="#121826" stroke="#7c5cff" stroke-width="2"/>
  <text x="780" y="175" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c5cff">3 · RE-RUN</text>
  <text x="780" y="205" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="13" fill="#e2e8f0">Same golden set</text>

  <rect x="230" y="310" width="220" height="110" rx="16" fill="#121826" stroke="#00e5c0" stroke-width="2"/>
  <text x="340" y="355" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#00e5c0">4a · SHIP</text>
  <text x="340" y="385" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="13" fill="#e2e8f0">Changelog · version bump</text>

  <rect x="510" y="310" width="220" height="110" rx="16" fill="#121826" stroke="#f87171" stroke-width="2"/>
  <text x="620" y="355" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#f87171">4b · LOOP</text>
  <text x="620" y="385" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="13" fill="#e2e8f0">Back to score</text>

  <line x1="280" y1="185" x2="380" y2="185" stroke="#00e5c0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="185" x2="680" y2="185" stroke="#00e5c0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="240" x2="340" y2="310" stroke="#00e5c0" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="780" y1="240" x2="620" y2="310" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M 510 365 C 120 365, 120 185, 180 240" fill="none" stroke="#7c5cff" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Golden set callout -->
  <rect x="80" y="450" width="800" height="50" rx="14" fill="#0a0e16" stroke="url(#accentGrad)" stroke-width="2" filter="url(#glow)"/>
  <text x="480" y="481" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">Golden set: happy · edge · cliff — portable across models</text>

  <text x="48" y="525" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="#64748b">The Ai Master Class · Prompt Engineering Mastery · Module 5</text>
</svg>
