<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Roles, constraints, and formats stack</title>
  <desc id="desc">Layered diagram: Role on top, Hard constraints fence, Soft preferences nudge, Format packages reliable output.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#00e5c0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#00e5c0"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  <circle cx="100" cy="70" r="80" fill="#7c5cff" opacity="0.12"/>
  <circle cx="880" cy="480" r="100" fill="#00e5c0" opacity="0.10"/>

  <text x="48" y="48" font-family="DM Sans, system-ui, sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">Role · Constraints · Format</text>
  <text x="48" y="74" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#94a3b8">Hard fences · Soft nudges · Format packages the handoff</text>

  <!-- Role -->
  <rect x="80" y="110" width="800" height="70" rx="14" fill="#121826" stroke="#7c5cff" stroke-width="2"/>
  <text x="104" y="142" font-family="DM Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#7c5cff">ROLE</text>
  <text x="104" y="164" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">Job + optimize-for + optional refuse — changes decisions, not costume</text>

  <!-- Hard -->
  <rect x="80" y="200" width="380" height="120" rx="14" fill="#121826" stroke="#f87171" stroke-width="2"/>
  <text x="104" y="232" font-family="DM Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#f87171">HARD CONSTRAINTS</text>
  <text x="104" y="258" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">Must / must-not · break-the-build</text>
  <text x="104" y="280" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="#94a3b8">Max length · no speculation · BLOCKER label</text>
  <text x="104" y="300" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="#94a3b8">Preserve IDs · empty-state rules</text>

  <!-- Soft -->
  <rect x="500" y="200" width="380" height="120" rx="14" fill="#121826" stroke="#fbbf24" stroke-width="2"/>
  <text x="524" y="232" font-family="DM Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#fbbf24">SOFT PREFERENCES</text>
  <text x="524" y="258" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">Nice-to-have · when you have room</text>
  <text x="524" y="280" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="#94a3b8">Lead with highest risk · plain words</text>
  <text x="524" y="300" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="#94a3b8">Warm phrasing if it fits</text>

  <!-- Priority chip -->
  <rect x="300" y="340" width="360" height="44" rx="12" fill="#0a0e16" stroke="#a78bfa" stroke-width="2"/>
  <text x="480" y="368" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#a78bfa">PRIORITY — who wins when hard rules collide</text>

  <!-- Format -->
  <rect x="80" y="406" width="520" height="70" rx="14" fill="#121826" stroke="#00e5c0" stroke-width="2"/>
  <text x="104" y="438" font-family="DM Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#00e5c0">FORMAT</text>
  <text x="104" y="460" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">Table columns · JSON keys · checklist verbs — no wrapper prose</text>

  <!-- Output -->
  <rect x="620" y="406" width="260" height="70" rx="14" fill="#0a0e16" stroke="url(#accentGrad)" stroke-width="2" filter="url(#glow)"/>
  <text x="750" y="438" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Parseable output</text>
  <text x="750" y="460" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="#94a3b8">Ready for human or tool</text>

  <line x1="270" y1="320" x2="360" y2="340" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8"/>
  <line x1="690" y1="320" x2="600" y2="340" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8"/>
  <line x1="480" y1="384" x2="340" y2="406" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="441" x2="620" y2="441" stroke="#00e5c0" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="48" y="520" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="#64748b">The Ai Master Class · Prompt Engineering Mastery · Module 2</text>
</svg>
