<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
<title id="title">Reading metrics that matter to the business</title>
<desc id="desc">Translate accuracy/precision/recall into dollars and ops cost.</desc>
<defs>
<linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b0f19"/><stop offset="100%" stop-color="#121826"/></linearGradient>
<linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#3b82f6"/></marker>
</defs>
<rect width="960" height="540" fill="url(#bgGrad)"/>
<circle cx="120" cy="80" r="90" fill="#10b981" opacity="0.12"/>
<circle cx="860" cy="460" r="110" fill="#3b82f6" opacity="0.10"/>
<text x="48" y="52" font-family="DM Sans, system-ui, sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">Metrics that matter</text>
<text x="48" y="78" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#94a3b8">Translate accuracy/precision/recall into dollars and ops cost.</text>
<rect x="48" y="130" width="200" height="160" rx="16" fill="#121826" stroke="#10b981" stroke-width="2"/>
<text x="68" y="165" font-family="DM Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#10b981">METRIC</text>
<text x="68" y="200" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">Not vanity</text>
<text x="68" y="225" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">accuracy</text>
<line x1="248" y1="210" x2="268" y2="210" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="268" y="130" width="200" height="160" rx="16" fill="#121826" stroke="#34d399" stroke-width="2"/>
<text x="288" y="165" font-family="DM Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#34d399">COST</text>
<text x="288" y="200" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">FP $</text>
<text x="288" y="225" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">FN $</text>
<line x1="468" y1="210" x2="488" y2="210" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="488" y="130" width="200" height="160" rx="16" fill="#121826" stroke="#fbbf24" stroke-width="2"/>
<text x="508" y="165" font-family="DM Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#fbbf24">MATRIX</text>
<text x="508" y="200" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">Four</text>
<text x="508" y="225" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">buckets</text>
<line x1="688" y1="210" x2="708" y2="210" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="708" y="130" width="200" height="160" rx="16" fill="#121826" stroke="#3b82f6" stroke-width="2"/>
<text x="728" y="165" font-family="DM Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#3b82f6">DECIDE</text>
<text x="728" y="200" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">Hold</text>
<text x="728" y="225" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#e2e8f0">tune kill</text>
<rect x="230" y="360" width="500" height="90" rx="18" fill="#0a0e16" stroke="url(#accentGrad)" stroke-width="2" filter="url(#glow)"/>
<text x="480" y="400" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">Ships Monday morning</text>
<text x="480" y="428" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="13" fill="#94a3b8">Northstar Studio / Acme Ops / classroom-safe</text>

<text x="48" y="510" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="#64748b">The Ai Master Class | No-Code Machine Learning Intuition | Module 6</text>
