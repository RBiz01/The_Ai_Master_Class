<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Confirm cut readiness · Generative Media</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root { --bg:#0b0f19; --panel:#121826; --border:#1e293b; --text:#e2e8f0; --muted:#94a3b8;
  --accent:#ec4899; --accent2:#f59e0b; --danger:#f87171; --ok:#34d399; --warn:#fbbf24; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; font-family:"DM Sans",system-ui,sans-serif;
  background: radial-gradient(1200px 600px at 10% -10%, rgba(236,72,153,.18), transparent),
  radial-gradient(900px 500px at 100% 0%, rgba(245,158,11,.12), transparent), var(--bg);
  color:var(--text); line-height:1.55; }
.wrap { max-width:820px; margin:0 auto; padding:28px 20px 48px; }
.badge { display:inline-flex; font-size:12px; letter-spacing:.04em; text-transform:uppercase;
  color:var(--accent2); background:rgba(245,158,11,.08); border:1px solid rgba(245,158,11,.25);
  padding:6px 10px; border-radius:999px; }
h1 { font-size:1.55rem; margin:14px 0 8px; }
.sub { color:var(--muted); margin:0 0 22px; }
.card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:16px; }
.card h2 { margin:0 0 10px; font-size:1rem; color:#fff; }
.prompt-box { background:#0a0e16; border:1px dashed #334155; border-radius:10px; padding:12px 14px;
  font-family:ui-monospace,Menlo,monospace; font-size:.9rem; color:#cbd5e1; white-space:pre-wrap; }
label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:6px; }
textarea,input[type=text] { width:100%; background:#0a0e16; color:var(--text); border:1px solid #334155;
  border-radius:10px; padding:12px 14px; font:inherit; resize:vertical; }
textarea:focus,input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(236,72,153,.25); }
.row { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
button { appearance:none; border:0; cursor:pointer; background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff; font-weight:600; padding:10px 16px; border-radius:10px; }
button.secondary { background:transparent; border:1px solid #334155; color:var(--text); }
#feedback { display:none; margin-top:12px; padding:12px 14px; border-radius:10px; border:1px solid var(--border); }
#feedback.show { display:block; }
#feedback.ok { background:rgba(52,211,153,.08); border-color:rgba(52,211,153,.35); color:#bbf7d0; }
#feedback.bad { background:rgba(248,113,113,.08); border-color:rgba(248,113,113,.35); color:#fecaca; }
#feedback.partial { background:rgba(251,191,36,.08); border-color:rgba(251,191,36,.35); color:#fde68a; }
.success { display:none; margin-top:16px; padding:14px 16px; border-radius:12px; border:1px solid rgba(245,158,11,.4);
  background:linear-gradient(135deg,rgba(236,72,153,.15),rgba(245,158,11,.1)); }
.success.show { display:block; }
.success strong { color:var(--accent2); }
.checks { list-style:none; padding:0; margin:8px 0 0; }
.checks li { padding:4px 0 4px 22px; position:relative; color:var(--muted); }
.checks li:before { content:"○"; position:absolute; left:0; }
.checks li.pass { color:var(--ok); }
.checks li.pass:before { content:"●"; }
.hint { font-size:.85rem; color:var(--muted); margin-top:8px; }
.choice { display:block; width:100%; text-align:left; margin:8px 0; padding:12px 14px; background:#0a0e16;
  border:1px solid #334155; border-radius:10px; color:var(--text); cursor:pointer; font:inherit; }
.choice.selected { border-color:var(--accent); }
.checkrow { display:flex; gap:10px; align-items:flex-start; margin:8px 0; }
</style></head><body><div class="wrap">
<div class="badge">Module 7 · Lesson 3 · Interactive</div><h1>Confirm cut readiness</h1><p class="sub">Checklist the ship blockers.</p>
<div class="card"><h2>Instructions</h2><ol><li>Flag every ship-blocker.</li><li>Click Check.</li></ol></div>
<div class="card"><h2>Flag issues</h2><div class="checkrow"><input type="checkbox" id="captions"/><label for="captions" style="margin:0">Muted-first captions on the hook</label></div><div class="checkrow"><input type="checkbox" id="motion"/><label for="motion" style="margin:0">Motion prompts avoid product morph</label></div><div class="checkrow"><input type="checkbox" id="end"/><label for="end" style="margin:0">End card with Northstar wordmark (~2s)</label></div><div class="checkrow"><input type="checkbox" id="export"/><label for="export" style="margin:0">9:16 master + derived crops listed</label></div>
<div class="row"><button type="button" id="check">Check</button>
<button type="button" class="secondary" id="hintBtn">Show hint</button></div>
<p class="hint" id="hint" hidden>All four required to ship.</p></div>
<div id="feedback" role="status" aria-live="polite"></div>
<div class="success" id="success"><strong>Nice work.</strong> Capture a takeaway, then continue.</div>
</div><script>
const must=["captions", "motion", "end", "export"];
const feedback=document.getElementById('feedback'), success=document.getElementById('success'), hint=document.getElementById('hint');
document.getElementById('hintBtn').onclick=()=>hint.hidden=!hint.hidden;
document.getElementById('check').onclick=()=>{
const ok=must.every(id=>document.getElementById(id).checked);
if(ok){feedback.className='show ok';feedback.textContent='All critical issues flagged.';success.classList.add('show');}
else {feedback.className='show bad';feedback.textContent='Flag every listed ship-blocker.';success.classList.remove('show');}
};
</script></body></html>
